name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.7"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check --error-on-warning
      - run: uv run --locked python -m unittest discover -s tests -p 'test_*.py'
      - run: uv run --locked python -m py_compile cslam-stm32-app/run_demo.py
      - run: uv run --locked python -c "import cflib, numpy"
      - run: uv run --locked python cslam-stm32-app/run_demo.py --help

  protocol:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install C quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18 cppcheck
      - name: Test UWB pose update decoder
        run: |
          cc -std=c11 -Wall -Wextra -Werror tests/pose_update_packet_test.c -lm -o /tmp/pose_update_packet_test
          /tmp/pose_update_packet_test
      - name: Test GAP9 pose graph on host
        run: sh tests/run_point_cloud_test.sh
      - name: Check owned C formatting
        run: |
          find cslam-gap9-app cslam-stm32-app/src tests -type f \
            \( -name '*.c' -o -name '*.h' \) \
            ! -path 'cslam-stm32-app/src/tof-matrix/drivers/vl53l5cx_api.*' \
            ! -path 'cslam-stm32-app/src/tof-matrix/drivers/vl53l5cx_buffers.h' \
            -print0 | xargs -0 clang-format-18 --dry-run --Werror
      - name: Analyze owned C code
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 \
            --inline-suppr --suppress=missingIncludeSystem \
            --suppress=missingInclude --suppress=unmatchedSuppression \
            --suppress=unknownMacro --suppress=assertWithSideEffect \
            --suppress=integerOverflowCond --language=c --std=c11 \
            -Itests/stubs -Icslam-gap9-app/point-cloud \
            -Icslam-gap9-app/icp -Icslam-gap9-app/slam \
            -Icslam-stm32-app/src \
            cslam-gap9-app/dma cslam-gap9-app/gpio cslam-gap9-app/icp \
            cslam-gap9-app/point-cloud cslam-gap9-app/slam \
            cslam-gap9-app/spi cslam-gap9-app/main.c \
            cslam-stm32-app/src/radio_comm.c \
            cslam-stm32-app/src/tof-matrix/drivers/i2c_expander.c \
            cslam-stm32-app/src/tof-matrix/i2c_platform.c \
            cslam-stm32-app/src/tof-matrix/tof_matrix.c \
            cslam-stm32-app/src/tof_daq.c \
            cslam-stm32-app/src/uwb_collision_det.c \
            cslam-stm32-app/src/uwb_ranging.c tests/*.c

  stm32:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install ARM compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Apply pinned firmware patch
        run: |
          if ! git -C crazyflie-firmware apply --reverse --check ../changes.patch; then
            git -C crazyflie-firmware apply ../changes.patch
          fi
      - name: Build STM32 firmware
        working-directory: cslam-stm32-app
        run: make all
