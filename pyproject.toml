[project]
name = "nano-c-slam-demo"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cflib==0.1.34",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "build",
    "install",
    "log",
    "crazyflie-firmware",
    "uwb-software-library",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # Pyflakes correctness checks
    "I",     # import sorting
    "UP",    # modern Python syntax
    "B",     # likely bugs
    "SIM",   # simplifications
    "RUF",   # Ruff correctness/style checks
    "ANN",   # annotations on owned runtime/test code
    "ASYNC", # async correctness
    "S",     # security-sensitive patterns
    "PTH",   # pathlib usage
    "PERF",  # avoid costly patterns
    "DTZ",   # explicit timezone handling
    "G",     # logging format discipline
    "LOG",   # logging best practices
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # Tests intentionally use assertions.

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = [
    "cslam-stm32-app/run_demo.py",
    "scripts/check_gazebo_macos.py",
    "scripts/gazebo_mapping_sitl.py",
    "scripts/verify_gazebo_collector_ros.py",
    "scripts/diagnose_gazebo_odom.py",
    "scripts/capture_gap9_host_mapping_diagnostic.py",
    "scripts/capture_gap9_gvsoc_mapping_diagnostic.py",
    "scripts/write_gap9_build_provenance.py",
    "scripts/run_gap9_gvsoc_target.py",
    "scripts/gap9_gvsoc_spi_probe_protocol.py",
    "scripts/capture_gap9_gvsoc_spi_main_probe_evidence.py",
    "scripts/gvsoc_spi_slave_probe_control.py",
    "scripts/capture_gap9_gvsoc_spi_probe_evidence.py",
    "scripts/validation_provenance.py",
    "scripts/gap9_mapping_diagnostic.py",
    "scripts/compare_gap9_mapping_diagnostics.py",
    "sim/gazebo/nano_c_slam_gazebo/nano_c_slam_gazebo/mapping_model.py",
    "sim/gazebo/nano_c_slam_gazebo/nano_c_slam_gazebo/telemetry_model.py",
    "tests/test_run_demo.py",
    "tests/test_gazebo_mission.py",
    "tests/test_gazebo_mapping_sitl.py",
    "tests/test_gazebo_telemetry_model.py",
    "sim/gazebo/nano_c_slam_gazebo/nano_c_slam_gazebo/mission_model.py",
    "sim/gazebo/nano_c_slam_gazebo/nano_c_slam_gazebo/mapping_run_model.py",
    "tests/test_gazebo_mapping_run.py",
    "tests/test_gazebo_mapping_run_processes.py",
    "tests/test_gazebo_mapping_run_cli.py",
    "tests/test_gap9_host_mapping_diagnostic.py",
    "tests/test_gap9_gvsoc_mapping_diagnostic.py",
    "tests/test_gap9_gvsoc_target_runner.py",
    "tests/test_gap9_gvsoc_spi_probe_protocol.py",
    "tests/test_gap9_gvsoc_spi_main_probe_evidence.py",
    "tests/test_gap9_gvsoc_spi_probe_evidence.py",
    "tests/test_validation_provenance.py",
    "tests/test_gap9_mapping_diagnostic_schema.py",
    "sim/gazebo/nano_c_slam_gazebo/nano_c_slam_gazebo/mapping_run_processes.py",
    "scripts/gazebo_mapping_run.py",
    "test_support/gap9_mapping_fixtures.py",
    "test_support/ros_fixtures.py",
]

[tool.ty.rules]
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "error"
unsound-return-statement = "error"

[dependency-groups]
dev = [
    "ruff>=0.17.1",
    "ty>=0.0.89",
]
